[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatscout"
version = "0.1.0"
description = "Composable, stateless rules for event recommendation campaigns"
requires-python = ">=3.10"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["seatscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
